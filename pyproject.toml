[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="ai-media-studio"
version="4.0.0"
description="Local-first, provider-neutral AI video production pipeline"
requires-python=">=3.10"
dependencies=["Pillow>=11,<13","numpy>=2,<3","requests>=2.32,<3","edge-tts>=7,<8"]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.9"]
[project.scripts]
ai-media-studio="main:main"
[tool.setuptools]
py-modules=["main"]
packages=["media_studio"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=120
target-version="py310"
exclude=["core","benchmarks","config.py"]
[tool.ruff.lint]
select=["E","F","I"]
